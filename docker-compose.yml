# Cactus Cove websites. NGINX Proxy Manager (separate stack) forwards:
#   cactuscove.casa      → http://cactus-cove-landing:80
#   stay.cactuscove.casa → http://cactus-cove-portal:3000
name: cactus-cove

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  landing:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/landing/Dockerfile
    image: cactus-cove-landing
    container_name: cactus-cove-landing
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks: [proxy]

  portal:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    image: cactus-cove-portal
    container_name: cactus-cove-portal
    env_file: .env
    environment:
      ORIGIN: ${PORTAL_ORIGIN:-https://stay.cactuscove.casa}
      # NPM sits in front, so trust its forwarded client IP (used for rate limiting).
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: 1
    # Home Assistant runs with network_mode: host; reach it via the host gateway.
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [proxy]

networks:
  proxy:
    name: ${PROXY_NETWORK:-npm_default}
    external: true
